<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../content/_kit/fonts/fonts.css">
<style>
  :root{--ink:#0D0F13;--paper:#FAF8F3;--amber:#F0B90B;--amber-deep:#8A6B06;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1920px;overflow:hidden;background:transparent;}
  body{font-family:'Montserrat',sans-serif;-webkit-font-smoothing:antialiased;color:var(--paper);}
  .layer{position:absolute;inset:0;overflow:hidden;}
  .vig{position:absolute;inset:0;background:radial-gradient(ellipse 85% 70% at 50% 45%, transparent 55%, rgba(0,0,0,.45) 100%);}
  .shade{position:absolute;left:0;right:0;height:900px;}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;}
  .bug{position:absolute;left:60px;top:230px;display:flex;align-items:center;gap:14px;font-family:'Unbounded';font-weight:800;font-size:34px;text-transform:uppercase;text-shadow:0 2px 12px rgba(0,0,0,.35);}
  .bug .m{width:20px;height:20px;background:var(--amber);border-radius:4px;transform:rotate(45deg);}
  .txt{position:absolute;left:70px;right:70px;font-family:'Unbounded',sans-serif;font-weight:800;text-transform:uppercase;line-height:1.08;}
  .txt .ln{display:block;width:max-content;white-space:nowrap;transform-origin:left center;text-shadow:0 6px 30px rgba(0,0,0,.45);}
  .txt .acc{color:var(--amber);}
  .txt .box{background:var(--amber);color:var(--ink);padding:0 .12em;text-shadow:none;border-radius:.06em;}
  .txt .inkbox{background:var(--ink);color:var(--paper);padding:0 .12em;text-shadow:none;border-radius:.06em;}
  .kicker{font-family:'Montserrat';font-weight:700;font-size:38px;text-transform:none;letter-spacing:.01em;margin-bottom:22px;display:inline-block;background:var(--amber);color:var(--ink);padding:10px 22px;border-radius:999px;text-shadow:none;}
  .slab{position:absolute;top:-300px;left:-700px;width:2500px;height:2600px;}
  .line{position:absolute;top:-300px;left:0;height:2600px;}
  .lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;}
  .lock .row{display:flex;align-items:center;gap:34px;}
  .lock .m{width:64px;height:64px;background:var(--amber);border-radius:13px;}
  .lock .w{font-family:'Unbounded';font-weight:800;font-size:150px;text-transform:uppercase;line-height:1;display:flex;}
  .lock .w span{display:inline-block;overflow:hidden;padding-bottom:.06em;}
  .lock .w span i{display:inline-block;font-style:normal;}
  .lock .sub{font-family:'Unbounded';font-weight:700;font-size:46px;color:var(--amber);text-transform:uppercase;letter-spacing:.05em;}
  .lock .tag{font-weight:700;font-size:36px;color:#C9CBD1;text-align:center;line-height:1.35;max-width:820px;}
</style>
</head>
<body>
<div id="root"></div>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), prog=(t,a,d)=>clamp((t-a)/d), lerp=(a,b,x)=>a+(b-a)*x;
const outExpo=x=>x>=1?1:1-Math.pow(2,-10*x), inExpo=x=>x<=0?0:Math.pow(2,10*x-10);
const outQuart=x=>1-Math.pow(1-x,4), inOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const outBack=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const el=(tag,cls,p,html)=>{const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; p.appendChild(e); return e;};
const SK=-18, OFF=3200;

let S, SPEC;
window.setup=(spec)=>{
  SPEC=spec; window.DURATION=spec.dur;
  const root=document.getElementById('root'); root.innerHTML='';
  S={};
  // grading helpers
  el('div','vig',root);
  const top=el('div','shade',root); top.style.top='0'; top.style.background='linear-gradient(rgba(0,0,0,.35),transparent)'; top.style.height='520px';
  const bot=el('div','shade',root); bot.style.bottom='0'; bot.style.background='linear-gradient(transparent,rgba(0,0,0,.55))';
  S.bug=el('div','bug',root,'<span class="m"></span>Решено');
  // titles
  S.texts=spec.texts.map(tx=>{
    const d=el('div','txt',root);
    if(tx.kicker) el('span','kicker',d,tx.kicker);
    tx.lines.forEach(l=>{ const s=el('span','ln',d); s.innerHTML=l; });
    return {d,tx};
  });
  S.flash=el('div','flash',root);
  // outro: slabs + lockup
  S.wave=el('div','layer',root);
  S.lines=[0,1].map(i=>{ const l=el('div','line',S.wave); l.style.width=(i?14:30)+'px'; l.style.background=i?'#FAF8F3':'#F0B90B'; return l; });
  S.slabs=['#8A6B06','#F0B90B','#FAF8F3','#0D0F13'].map(c=>{ const s=el('div','slab',S.wave); s.style.background=c; return s; });
  S.lock=el('div','lock',S.wave,`<div class="row"><div class="m"></div><div class="w">${'РЕШЕНО'.split('').map(c=>`<span><i>${c}</i></span>`).join('')}</div></div><div class="sub">Business Live</div><div class="tag">${spec.outroTag||'Форум владельцев и руководителей спортивного бизнеса'}</div>`);
  // fit text lines to width
  S.texts.forEach(({d,tx})=>{
    const W=1080-140; const lns=[...d.querySelectorAll('.ln')];
    lns.forEach(e=>e.style.fontSize='100px');
    if(tx.uniform){ const w=Math.max(...lns.map(e=>e.scrollWidth)); const sz=Math.min(tx.max||170,100*W/w); lns.forEach(e=>e.style.fontSize=sz+'px'); }
    else lns.forEach(e=>{ e.style.fontSize=Math.min(tx.max||200,100*W/e.scrollWidth)+'px'; });
    const h=d.getBoundingClientRect().height;
    const pos=tx.pos||'center';
    d.style.top=(pos==='top'?380:pos==='bottom'?1920-420-h:(1920-h)/2-40)+'px';
  });
};

window.render=(t)=>{
  const sp=SPEC;
  // brand bug, hidden under the outro
  S.bug.style.opacity=t<sp.outro-0.2?prog(t,0.3,0.4):0;
  // titles: slam in line by line, cut out hard (or quick fade)
  S.texts.forEach(({d,tx})=>{
    const on=t>=tx.t0 && t<tx.t1; d.style.display=on?'block':'none'; if(!on) return;
    const lns=[...d.querySelectorAll('.ln')];
    lns.forEach((e,i)=>{ const st=tx.t0+i*(tx.stagger??0.12); const p=prog(t,st,0.22);
      e.style.opacity=t>=st?1:0;
      const s=tx.style==='rise'? 1 : lerp(1.45,1,outQuart(p));
      const y=tx.style==='rise'? lerp(60,0,outExpo(p)) : 0;
      e.style.transform=`translateY(${y}px) scale(${s})`;
      if(tx.style==='rise') e.style.opacity=outExpo(p);
    });
    const k=d.querySelector('.kicker'); if(k){ const p=prog(t,tx.t0-0.05,0.25); k.style.opacity=p; k.style.transform=`translateY(${lerp(30,0,outExpo(p))}px)`; }
    // gentle drift while on screen
    d.style.transform=`scale(${1+0.02*prog(t,tx.t0,tx.t1-tx.t0)})`;
  });
  // flashes on chosen cuts
  let f=0; for(const c of sp.flashes||[]){ if(t>=c && t<c+0.15) f=Math.max(f,0.85*(1-prog(t,c,0.15))); }
  S.flash.style.opacity=f;
  // outro wave
  const T=sp.outro, n=S.slabs.length;
  S.slabs.forEach((s,i)=>{ const a=outExpo(prog(t,T+i*0.07,0.5)); s.style.transform=`translateX(${lerp(-OFF,0,a)}px) skewX(${SK}deg)`; });
  S.lines.forEach((l,i)=>{ const p=prog(t,T-0.08+i*0.05,0.42); l.style.display=p>0&&p<1?'block':'none'; l.style.transform=`translateX(${lerp(-500,1600,inOut(p))}px) skewX(${SK}deg)`; });
  const L=T+0.5; const lk=S.lock; lk.style.display=t>=L?'flex':'none';
  if(t>=L){
    const m=lk.querySelector('.m'); m.style.transform=`rotate(${lerp(-315,45,outQuart(prog(t,L,0.6)))}deg) scale(${outBack(prog(t,L,0.5))})`;
    [...lk.querySelectorAll('.w i')].forEach((e,i)=>{ e.style.transform=`translateY(${lerp(110,0,outExpo(prog(t,L+0.12+i*0.045,0.5)))}%)`; });
    const sb=lk.querySelector('.sub'); const p=outQuart(prog(t,L+0.45,0.6)); sb.style.opacity=p; sb.style.letterSpacing=lerp(0.5,0.05,p)+'em';
    const tg=lk.querySelector('.tag'); const q=outQuart(prog(t,L+0.7,0.6)); tg.style.opacity=q; tg.style.transform=`translateY(${lerp(20,0,q)}px)`;
  }
};
window.ready=(async()=>{ await document.fonts.ready;
  await Promise.all(['800 40px Unbounded','700 40px Unbounded','700 40px Montserrat'].map(f=>document.fonts.load(f,'РЕШЕНО Aa'))); return true; })();
</script>
</body>
</html>
