<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../content/_kit/fonts/fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;background:#0D0F13;color:#FAF8F3;font-family:Montserrat,sans-serif;-webkit-font-smoothing:antialiased;position:relative}
.glow{position:absolute;border-radius:50%;filter:blur(150px);background:rgba(240,185,11,.26)}
.grid{position:absolute;inset:0;background-image:radial-gradient(rgba(250,248,243,.06) 1.5px,transparent 1.6px);background-size:28px 28px}
.logo{position:absolute;left:96px;top:84px;display:flex;align-items:center;gap:22px;font-family:Unbounded}
.mark{width:30px;height:30px;background:#F0B90B;border-radius:7px;transform:rotate(45deg)}
.logo b{font-weight:800;font-size:46px;display:block}.logo small{font-weight:700;font-size:21px;color:#F0B90B;display:block;margin-top:6px}
.corner{position:absolute;right:96px;top:104px;font-family:Unbounded;font-weight:700;font-size:26px;opacity:.5}
h1{position:absolute;left:96px;top:215px;font-family:Unbounded;font-weight:800;font-size:76px;line-height:1.04;text-transform:uppercase}
h1 i{font-style:normal;color:#F0B90B}
.sub{position:absolute;left:96px;top:330px;font-size:32px;font-weight:600;color:#C9CBD1}
.zubr{position:absolute;right:150px;top:70px;height:400px}
.row{position:absolute;left:0;height:230px;display:flex;gap:44px;will-change:transform}
.card{position:relative;width:340px;height:190px;flex-shrink:0;background:#FAF8F3;border-radius:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.card img{max-width:250px;max-height:104px;object-fit:contain;display:block}
.card .tape{position:absolute;top:-14px;left:50%;width:110px;height:30px;margin-left:-55px;background:rgba(240,185,11,.92);border-radius:4px}
.fade{position:absolute;top:0;bottom:0;width:180px;z-index:3}
.fade.l{left:0;background:linear-gradient(90deg,#0D0F13,rgba(13,15,19,0))}
.fade.r{right:0;background:linear-gradient(-90deg,#0D0F13,rgba(13,15,19,0))}
.foot{position:absolute;left:96px;bottom:60px;font-family:Unbounded;font-weight:700;font-size:24px;opacity:.5}
/* static still: 5x2 grid, no marquee */
.still .row{left:50%;transform:translateX(-50%)!important}
.foot{display:none} .still .fade{display:none}
</style></head><body>
<div class="glow" id="g1" style="width:900px;height:900px"></div>
<div class="glow" id="g2" style="width:700px;height:700px;background:rgba(240,185,11,.16)"></div>
<div class="grid"></div>
<div class="logo"><div class="mark"></div><div><b>РЕШЕНО</b><small>BUSINESS LIVE</small></div></div>
<h1>Спасибо <i>партнёрам</i></h1>
<div class="sub">Вместе делаем спортивный бизнес сильнее</div>
<img class="zubr" id="zubr" src="../../content/_kit/img/zubr-aplodiruet.png">
<div class="row" id="r1" style="top:500px"></div>
<div class="row" id="r2" style="top:750px"></div>
<div class="fade l"></div><div class="fade r"></div>
<script>
const L='../partnery-logo/';
const A=['sportmaster-pro.png','splace.png','fond-nashe-budushchee.svg','alphakeepers.png','legenda.png'];
const B=['sport-erp.png','association.png','futboliada.jpg','ognikovo.png'];
const STEP=340+44, PA=A.length*STEP, PB=B.length*STEP; // one period of each marquee row
const DURATION=30; window.DURATION=DURATION;
const tilt=[-2.2,1.6,-1.2,2.4,-1.8];
const fill=(el,arr,reps)=>{el.innerHTML=Array.from({length:reps},()=>arr).flat().map((f,i)=>`<div class="card" style="transform:rotate(${tilt[i%5]}deg)"><div class="tape"></div><img src="${L}${f}"></div>`).join('');};
const still=location.hash==='#still';
if(still){document.body.classList.add('still');fill(r1,A,1);fill(r2,B,1);} else {fill(r1,A,4);fill(r2,B,5);}
window.render=(t)=>{
  t=((t%DURATION)+DURATION)%DURATION; const T=2*Math.PI*t/DURATION, f=t/DURATION;
  g1.style.left=(-200+140*Math.sin(T))+'px'; g1.style.top=(300+100*Math.cos(T))+'px';
  g2.style.left=(1100+120*Math.cos(T))+'px'; g2.style.top=(500+80*Math.sin(2*T))+'px';
  if(!still){ r1.style.transform=`translateX(${-PA*f - 60}px)`; r2.style.transform=`translateX(${-PB*2 + PB*f}px)`; }
  zubr.style.transform=`translateY(${Math.sin(T*6)*7}px) rotate(${Math.sin(T*6+1)*1.5}deg)`;
};
window.ready=(async()=>{await document.fonts.ready;await Promise.all(['800 40px Unbounded','700 40px Unbounded','600 40px Montserrat'].map(f=>document.fonts.load(f,'РЕШЕНО Aa')));
  await Promise.all([...document.images].map(i=>i.decode().catch(()=>{}))); render(0);})();
</script></body></html>
