<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../content/_kit/fonts/fonts.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#0D0F13;--amber:#F0B90B;--paper:#FAF8F3}
  body{width:var(--W);height:var(--H);overflow:hidden;background:var(--ink);font-family:Montserrat,sans-serif;color:var(--paper);-webkit-font-smoothing:antialiased}
  .abs{position:absolute}
  .bg{inset:0;background-size:cover;background-position:center}
  .glow{border-radius:50%;background:rgba(240,185,11,.55);filter:blur(110px)}
  .shadeL{inset:0;background:linear-gradient(90deg,rgba(13,15,19,.92) 0%,rgba(13,15,19,.55) 55%,rgba(13,15,19,0) 100%)}
  .shadeB{left:0;right:0;bottom:0;height:520px;background:linear-gradient(180deg,rgba(13,15,19,0),rgba(13,15,19,.85))}
  .ghost{font-family:Unbounded;font-weight:800;color:rgba(250,248,243,.06);white-space:nowrap;line-height:1.24}
  .person img{position:absolute;inset:0;width:100%;height:100%}
  .top{display:flex;align-items:center;gap:24px}
  .logo{display:flex;align-items:center;gap:14px}
  .mark{width:18px;height:18px;background:var(--amber);border-radius:4px;transform:rotate(45deg)}
  .lt b{display:block;font-family:Unbounded;font-weight:800;font-size:30px;line-height:1.24}
  .lt small{display:block;font-family:Unbounded;font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--amber);margin-top:2px}
  .rule{height:2px;background:rgba(250,248,243,.55)}
  .label{font-weight:600;font-size:22px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
  .tb{display:flex;flex-direction:column;align-items:flex-start}
  .kick{background:var(--paper);color:var(--ink);font-weight:700;font-size:24px;padding:10px 22px;border-radius:999px}
  .name{font-family:Unbounded;font-weight:800;text-transform:uppercase;line-height:1}
  .hl{background:var(--amber);color:var(--ink);padding:6px 24px 10px 20px;transform:rotate(-2deg);transform-origin:left top}
  .role{font-weight:600;line-height:1.25}
  .tlabel{font-weight:700;font-size:20px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
  .topic{font-weight:700;line-height:1.2}
  .cta{display:flex;align-items:center;gap:14px;background:var(--amber);color:var(--ink);font-weight:700;border-radius:12px;padding:14px 18px 14px 26px;transform:rotate(-3deg);transform-origin:left top}
  .arrow{background:var(--ink);color:var(--amber);border-radius:999px;padding:2px 10px 4px}
  .foot{opacity:.7}
</style></head>
<body><div id="r"></div>
<script>
window.build = (s) => {
  const story = s.story, W = 1080, H = story ? 1920 : 1350;
  document.documentElement.style.setProperty('--W', W + 'px'); document.documentElement.style.setProperty('--H', H + 'px');
  const ph = story ? 920 : 1120, pw = Math.round(ph * 853 / 1280), px = story ? W - pw + 30 : W - pw + 120, py = H - ph, gw = story ? 1000 : 820;
  document.getElementById('r').innerHTML = `
  <div class="abs bg" style="background-image:url(${s.bg})"></div>
  <div class="abs glow" style="width:${gw}px;height:${gw}px;left:${W - gw * .78}px;top:${story ? H - 1150 : 260}px"></div>
  <div class="abs shadeL"></div><div class="abs shadeB"></div>
  <div class="abs ghost" style="font-size:${story ? 330 : 300}px;left:-30px;bottom:-40px">СПИКЕР</div>
  <div class="abs person" style="left:${px}px;top:${py}px;width:${pw}px;height:${ph}px"><img src="${s.paper}"><img src="${s.photo}"></div>
  <div class="abs top" style="left:70px;top:${story ? 230 : 70}px">
    <div class="logo"><div class="mark"></div><div class="lt"><b>РЕШЕНО</b><small>BUSINESS LIVE</small></div></div>
    <div class="rule" style="width:${story ? 420 : 470}px"></div><div class="label">Спикер</div></div>
  <div class="abs tb" style="left:70px;top:${story ? 420 : 300}px">
    <div class="kick">Спикер форума РЕШЕНО</div>
    <div class="name" style="font-size:${story ? 84 : 72}px;margin-top:34px">${s.first}</div>
    <div class="name hl" style="font-size:${story ? 84 : 72}px">${s.last}</div>
    <div class="role" style="font-size:${story ? 36 : 32}px;width:${story ? 560 : 500}px;margin-top:36px">${s.role}</div>
    <div class="tlabel" style="margin-top:30px">Тема выступления</div>
    <div class="topic" style="font-size:${story ? 40 : 36}px;width:${story ? 600 : 500}px;margin-top:10px">${s.topic}</div></div>
  <div class="abs cta" style="left:70px;top:${H - (story ? 420 : 250)}px;font-size:${story ? 32 : 28}px">${s.cta}<span class="arrow">→</span></div>
  <div class="abs foot" style="left:70px;top:${H - (story ? 300 : 120)}px;font-size:${story ? 26 : 22}px;width:${story ? 380 : 470}px;line-height:1.24">Форум владельцев и руководителей спортивного бизнеса</div>`;
  return Promise.all([...document.images].map(i => i.decode().catch(() => {}))).then(() => document.fonts.ready);
};
</script></body></html>
