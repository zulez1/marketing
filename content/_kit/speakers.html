<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><link rel="stylesheet" href="fonts/fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;background:#0D0F13;color:#FAF8F3;font-family:Montserrat,sans-serif;-webkit-font-smoothing:antialiased}
.top{position:absolute;left:70px;right:70px;top:70px;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:16px;font-family:Unbounded}.mark{width:20px;height:20px;background:#F0B90B;border-radius:5px;transform:rotate(45deg)}
.logo b{font-weight:800;font-size:30px;display:block}.logo small{font-weight:700;font-size:15px;color:#F0B90B;display:block;margin-top:4px}
.corner{font-family:Unbounded;font-weight:700;font-size:24px;opacity:.55}
h1{position:absolute;left:70px;right:70px;top:170px;font-family:Unbounded;font-weight:800;font-size:76px;line-height:1.02;text-transform:uppercase}
h1 i{font-style:normal;color:#F0B90B}
.grid{position:absolute;left:70px;right:70px;top:340px;bottom:150px;display:grid;gap:18px}
.c{position:relative;border-radius:24px;overflow:hidden;background:#16181D;border:1.5px solid #2B2E35}
.c .ph{position:absolute;left:0;right:0;top:0;bottom:0}
.c .ph img{position:absolute;left:50%;transform:translateX(-50%);bottom:0;height:96%}
.c .sh{position:absolute;left:0;right:0;bottom:0;height:55%;background:linear-gradient(180deg,rgba(13,15,19,0),rgba(13,15,19,.95) 70%)}
.c .t{position:absolute;left:18px;right:18px;bottom:16px}
.c .n{font-family:Unbounded;font-weight:800;text-transform:uppercase;line-height:1.05}
.c .r{font-weight:600;color:#C9CBD1;line-height:1.25;margin-top:6px}
.bottom{position:absolute;left:70px;right:70px;bottom:70px;display:flex;justify-content:space-between;font-weight:600;font-size:26px}.bottom span{opacity:.6}
</style></head><body>
<div class="top"><div class="logo"><div class="mark"></div><div><b>РЕШЕНО</b><small>BUSINESS LIVE</small></div></div><span class="corner">13–14.11 · Москва</span></div>
<h1 id="h"></h1><div class="grid" id="g"></div>
<div class="bottom"><span>Форум владельцев спортивного бизнеса</span><span>reshenoforum.ru</span></div>
<script>
const A='/speakers/assets/';
window.build=(s)=>{document.getElementById('h').innerHTML=s.title;const g=document.getElementById('g');
 const n=s.people.length,cols=n<=3?n:3,rows=Math.ceil(n/cols);g.style.gridTemplateColumns=`repeat(${cols},1fr)`;g.style.gridTemplateRows=`repeat(${rows},1fr)`;
 const big=n<=3;
 g.innerHTML=s.people.map(p=>`<div class="c"><div class="ph"><img src="${A}${p.id}_paper.png" style="opacity:.95"><img src="${A}${p.id}_cutout_color.png"></div><div class="sh"></div>
  <div class="t"><div class="n" style="font-size:${big?40:28}px">${p.name}</div><div class="r" style="font-size:${big?24:19}px">${p.role}</div></div></div>`).join('');
 return Promise.all([...document.images].map(i=>i.decode().catch(()=>{}))).then(()=>document.fonts.ready);};
window.ready=document.fonts.ready;
</script></body></html>
